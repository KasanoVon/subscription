<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>ページが見つかりません｜SubNote</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8f6ed;
        color: #2c2b26;
        font-family: 'Noto Sans JP', 'Helvetica Neue', Arial, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .box {
        background: #fdfdf5;
        border: 1.5px solid #2c2b26;
        border-radius: 8px;
        box-shadow: 3px 3px 0 rgba(44, 43, 38, 0.18);
        padding: 32px 28px;
        max-width: 420px;
      }
      h1 { font-size: 1.4rem; margin: 8px 0 12px; }
      p { color: #6b6a63; line-height: 1.7; margin: 0 0 20px; }
      a {
        display: inline-block;
        margin: 4px;
        padding: 8px 20px;
        border: 1.5px solid #2c2b26;
        border-radius: 4px;
        color: #2c2b26;
        text-decoration: none;
        box-shadow: 2px 2px 0 rgba(44, 43, 38, 0.15);
      }
      a.primary { background: #2c2b26; color: #fdfdf5; }
    </style>
  </head>
  <body>
    <div class="box">
      <div style="font-size: 2.5rem" aria-hidden="true">✏️</div>
      <h1>ページが見つかりません</h1>
      <p>URL が間違っているか、ページが移動した可能性があります。</p>
      <a class="primary" href="/">トップへ</a>
      <a href="/app">アプリを開く</a>
    </div>
  </body>
</html>
